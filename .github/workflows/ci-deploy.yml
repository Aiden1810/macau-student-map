name: CI + Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Translation contract
        run: npm run i18n:check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  deploy-vercel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-build
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_HPaY82QThdACpL6Yt4V8Zfhq
      VERCEL_PROJECT_ID: prj_Hpu3ocNgDefJ7ATF2juPvL45J30l
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Vercel CLI
        run: npm i -g vercel@64.3.1

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

      - name: Build Production Artifacts
        run: vercel build --prod --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
